name: supply-chain-copilot

x-backend: &backend
  build: ./backend
  image: supply-chain-copilot-backend:local
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://sc:${POSTGRES_PASSWORD:-sc}@postgres:5432/sc
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
    IMPORT_DIR: /import
    EMBED_CACHE_DIR: /models
    AS_OF: ${AS_OF:-2018-08-01T00:00:00}
    CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'
    AUTH_ENABLED: ${AUTH_ENABLED:-true}
    DEMO_USERS: ${DEMO_USERS:-true}
    ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
  # Containers run as the image's unprivileged user (uid 10001). State lives in the named volume; the host's
  # ./data/raw is only read (CSV drop-in, used instead of downloading from Kaggle when present).
  volumes:
    - appdata:/data
    - ./data/raw:/import:ro

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: sc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sc}
      POSTGRES_DB: sc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sc -d sc"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  seed:
    <<: *backend
    command: ["python", "-m", "app.cli", "etl"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # API docs and /metrics: reachable from this machine only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["arq", "app.workers.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.worker.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Delivers approved customer emails from its own queue (never waits behind a pipeline run).
  mailer:
    <<: *backend
    command: ["arq", "app.workers.mail_worker.MailWorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.mail_worker.MailWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Local SMTP server with a web inbox (http://localhost:8025): approved emails land here instead of real customers.
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  web:
    build: ./web
    image: supply-chain-copilot-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  # One-off CLI commands that write reports into ./samples on the host (make samples / backtest / eval).
  # On Linux, `make` passes your uid/gid so the files are owned by you.
  tools:
    <<: *backend
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    volumes:
      - appdata:/data
      - ./data/raw:/import:ro
      - ./samples:/app/samples
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"

  # Optional monitoring: docker compose --profile observability up -d  ->  http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    profiles: ["observability"]
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
