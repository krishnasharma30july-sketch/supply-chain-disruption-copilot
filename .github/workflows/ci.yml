name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: sc
          POSTGRES_PASSWORD: sc
          POSTGRES_DB: sc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sc -d sc" --health-interval 3s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://sc:sc@localhost:5432/sc
      LLM_PROVIDER: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Static analysis
        run: ruff check app tests migrations
      - name: Unit tests
        run: pytest -q
      - name: Migrations apply from scratch, re-apply idempotently and match the models
        run: |
          python -c "from app.db.session import init_db; init_db(); init_db()"
          alembic check
          alembic downgrade base
          alembic upgrade head

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build api web
      - name: Images run as non-root
        run: |
          test "$(docker run --rm supply-chain-copilot-backend:local id -u)" = "10001"
          test "$(docker run --rm --entrypoint id supply-chain-copilot-web:local -u)" = "101"
