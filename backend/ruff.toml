target-version = "py312"
line-length = 130
extend-exclude = ["migrations/versions"]  # autogenerated by Alembic

[lint]
# Pyflakes (undefined names, unused imports), bugbear (likely bugs) and syntax errors.
select = ["F", "B", "E9"]
# B008: FastAPI's Depends()/Query() defaults are the framework idiom, not a bug.
# B023: the flagged closures (kb.py flush, concepts.py add) are called within the same loop iteration.
ignore = ["B008", "B023"]
