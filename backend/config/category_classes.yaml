  profiles:
    HEAVY_BULKY: [heavy, bulky, oversized, large, big, volumoso, volumosos, pesado, pesados, grande, grandes]
  classes:
    PERISHABLE: [perishable, perishables, food, foods, fresh, beverage, beverages, drinks, flower, flowers, perecivel, pereciveis, alimento, alimentos, bebida, bebidas, flores]
    ESSENTIAL: [essential, essentials, baby, diapers, diaper, health, medicine, medical, hygiene, pet, fraldas, saude, bebe]
    FRAGILE: [fragile, glass, breakable, delicate, fragil, frageis, vidro]
    HIGH_VALUE_TECH: [electronics, electronic, tech, technology, gadget, gadgets, phone, phones, smartphone, computer, computers, laptop, laptops, eletronicos, celular, informatica]
    GIFT_SEASONAL: [gift, gifts, christmas, toy, toys, party, seasonal, presente, presentes, natal, brinquedo, brinquedos]
    FURNITURE_HOME: [home, household, housewares, homeware, appliance, appliances, casa, moveis, eletrodomestico, eletrodomesticos]
